---
name: Build - MoonlightVibe macOS

# A push to master BUILDS but no longer publishes. Publishing happens only on a
# v* tag, so committing and releasing are separate decisions. Before 2026-09-05
# every master push cut a release, which meant small fixes waited for something
# worth releasing to ride along with.
on:
  push:
    branches:
      - master
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    env:
      QT_VERSION: 6.11.1

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          submodules: 'recursive'
          fetch-depth: 1

      - name: Install create-dmg
        run: |
          brew install node
          npm install --global create-dmg

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          cache: true
          set-env: true
          add-tools-to-path: true
          version: ${{ env.QT_VERSION }}
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@073e34d7c2ab4ae6961ed7cca690b3abd5ba5a7e'

      - name: Set version
        id: version
        shell: bash
        run: |
          VERSION=$(cat app/version.txt)
          SHA=$(echo "$GITHUB_SHA" | cut -c1-6)
          # On a tag build the tag and app/version.txt must agree. If they do not,
          # the release title and the binary would claim different versions, and the
          # mismatch is invisible until someone reports it.
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            if [[ "v${VERSION}" != "$TAG" ]]; then
              echo "::error::Tag ${TAG} does not match app/version.txt (${VERSION}). Bump version.txt or move the tag."
              exit 1
            fi
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          # Hand-written notes for this version when they exist, otherwise the generic body
          # below. Release text is public and worth writing deliberately, but a release must
          # never be blocked on someone having remembered to write it. Matches MultiSeat.
          NOTES="docs/release-notes/${VERSION}.md"
          if [ -f "$NOTES" ]; then
            echo "notes_file=${NOTES}" >> "$GITHUB_OUTPUT"
            echo "Using hand-written notes from ${NOTES}"
          else
            echo "No ${NOTES}; falling back to the generic release body."
          fi
          echo "CI_VERSION=${VERSION}-${SHA}" >> "$GITHUB_ENV"

      - name: Build and package
        run: bash scripts/generate-dmg.sh Release

      - name: Rename DMG
        shell: bash
        run: |
          SRC=$(ls build/installer-Release/*.dmg | head -1)
          DST="build/installer-Release/MoonlightVibe-mac-${{ steps.version.outputs.version }}.dmg"
          mv "$SRC" "$DST"
          echo "DMG_PATH=$DST" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        # Non-fatal on a TAG build only. Observed 2026-09-08: this step failed with
        # "Failed to FinalizeArtifact: (403) Forbidden: Error from intermediary" - transient
        # GitHub artifact storage, with the build itself already green. Because "Create GitHub
        # Release" runs after this step and has no always() guard, that failure would abort the
        # job before publishing and leave a tag with no release.
        #
        # On master/workflow_dispatch this artifact is the ONLY output, so a failure there must
        # still fail the job - that is the signal a merge-verification build exists to give.
        continue-on-error: ${{ startsWith(github.ref, 'refs/tags/') }}
        with:
          name: MoonlightVibe-mac-${{ steps.version.outputs.version }}
          path: ${{ env.DMG_PATH }}
          compression-level: 0
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        # Tag pushes only. A master push builds and stops; workflow_dispatch never
        # publishes, which is what makes it safe for verifying a merge branch.
        if: startsWith(github.ref, 'refs/tags/')
        with:
          # Both platform workflows target this same tag, so one release carries
          # both assets. Whichever finishes second attaches to the existing release.
          tag_name: ${{ github.ref_name }}
          # body_path wins when docs/release-notes/<version>.md exists; body is the fallback.
          body_path: ${{ steps.version.outputs.notes_file }}
          name: MoonlightVibe ${{ steps.version.outputs.version }}
          files: ${{ env.DMG_PATH }}
          body: |
            Rebased onto `moonlight-stream/moonlight-qt` upstream.

            Built from `${{ github.sha }}` (`${{ steps.version.outputs.sha }}`).

            Windows and macOS assets are attached to this same release.

            Includes all MoonlightVibe patches: mic passthrough, per-seat stream settings, latency tuning, and configurable gamepad quit combo.
