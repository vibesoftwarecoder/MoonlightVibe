name: Bug report
description: Something is wrong with the MoonlightVibe client.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        MoonlightVibe is our streaming client — seat auto-discovery, per-seat stream settings,
        a configurable gamepad quit combo and microphone passthrough, built on Moonlight.
        **Client problems belong here**, including ones that turn out to come from upstream.

        Two things are genuinely a different component, and go faster if filed where they live:

        - The picture, the encoder or the host audio is wrong → that is the host side,
          [ApolloVibe](https://github.com/vibesoftwarecoder/ApolloVibe/issues).
        - A seat will not provision, or a seat streams the wrong desktop →
          [MultiSeat](https://github.com/vibesoftwarecoder/MultiSeat/issues).

        If you are not sure which of the three it is, file it here anyway and we will move it.

  - type: input
    id: version
    attributes:
      label: MoonlightVibe version
      placeholder: v6.2.1
    validations:
      required: true

  - type: dropdown
    id: also-upstream
    attributes:
      label: If you happen to have stock Moonlight, does it do this too? (optional)
      description: >
        Only answer if you already have it — please do not install another client just to fill
        this in. It helps us tell a MoonlightVibe regression apart from behaviour inherited from
        upstream, which changes where we look first. Either way the report stays with us.
      options:
        - "Not tried, or I do not have stock Moonlight"
        - "No — stock Moonlight is fine, only MoonlightVibe does this"
        - "Yes — stock Moonlight does it too"

  - type: dropdown
    id: host
    attributes:
      label: What are you streaming from?
      options:
        - A MultiSeat seat
        - ApolloVibe on the console
        - Standalone Apollo
        - Sunshine
        - Other or not sure
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true

  - type: textarea
    id: mic
    attributes:
      label: If this is a microphone problem
      description: >
        Microphone passthrough is the main thing this fork adds, so it gets its own questions.
        On the host, ApolloVibe renders your mic into the **Speakers (Steam Streaming
        Microphone)** playback device, and applications capture from **Microphone (Steam Streaming
        Microphone)**. Those are two different endpoints and they are easy to mix up.
      value: |
        - Is `stream_mic` enabled in the host's config? (it defaults to off)
        - Does the host show "Steam Streaming Microphone" as a recording device?
        - Which client microphone did you select?

  - type: textarea
    id: logs
    attributes:
      label: Client log
      description: |
        Please attach the file. `Moonlight-###.log` lives in `%TEMP%` on Windows and `/tmp` on
        macOS. On Linux, run the client from a terminal and copy what it prints.

        If the host is ApolloVibe or a MultiSeat seat, its log helps too — see the
        [ApolloVibe bug template](https://github.com/vibesoftwarecoder/ApolloVibe/issues/new/choose)
        for where those live.
      render: text

  - type: textarea
    id: client-details
    attributes:
      label: Client details
      value: |
        - OS and version:
        - GPU:
        - Decoder / renderer setting if changed from default:
        - Wired or Wi-Fi:
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else
